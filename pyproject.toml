[project]
name = "Habryn"
version = "0.1.0"
description = "A Mars colony simulation with a custom simulation engine and Pygame CE visualization."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Kenny Richardson" }
]

dependencies = [
    "pygame-ce>=2.5.0",
    "rich>=13.9.0",
    "loguru>=0.7.2"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
